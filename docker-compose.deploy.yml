# Deployment base. Like docker-compose.yml but the web service pulls a prebuilt
# image from a registry (GHCR) instead of building, and NEITHER service publishes
# a host port — both sit on the internal network behind a reverse proxy. This is
# the file the ssh-docker provider copies to the target host as docker-compose.yml.
#
# Two ways to put a proxy in front:
#   • Fresh host  -> also use docker-compose.caddy.yml (adds a Caddy on 80/443
#                    with automatic HTTPS, routing by hostname). The provider does
#                    this when STACK_CADDY=true.
#   • Host that already runs a reverse proxy (e.g. an existing Caddy/Traefik on
#     80/443) -> deploy this file alone and point that proxy at the `web` (:8080)
#     and `directus` (:8055) containers over the `directus-node-starter_default`
#     network. No published ports, no port juggling. (This is how uint8.me runs.)
#
# All values come from the .env the deploy provider renders next to this file.
name: directus-node-starter

services:
  directus:
    image: directus/directus:${DIRECTUS_VERSION:-11}
    restart: unless-stopped
    environment:
      SECRET: "${DIRECTUS_SECRET:?}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:?}"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/data.db"
      WEBSOCKETS_ENABLED: "true"
      PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost}"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      # Sits behind a TLS-terminating proxy -> secure cookies. Set COOKIE_SECURE=false
      # only if you front it with plain HTTP.
      REFRESH_TOKEN_COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      SESSION_COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      REFRESH_TOKEN_COOKIE_SAME_SITE: "lax"
      SESSION_COOKIE_SAME_SITE: "lax"
    volumes:
      - directus-database:/directus/database
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8055/server/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  web:
    image: "${WEB_IMAGE:?set WEB_IMAGE to the published web image}"
    restart: unless-stopped
    environment:
      PORT: "8080"
      DIRECTUS_URL: "http://directus:8055"
      DIRECTUS_PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost}"
    depends_on:
      directus:
        condition: service_healthy

volumes:
  directus-database:
  directus-uploads:
  directus-extensions:
