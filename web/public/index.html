<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A generic articles demo backed by Directus, served by a Node backend." />
    <title>The Starter Times — Directus + Node demo</title>
    <!-- Runtime config injected by the Node backend (CMS base + admin deep-link target). -->
    <script src="/app-config.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="//unpkg.com/alpinejs" defer></script>
</head>

<body>
    <div x-data="articlesApp()" x-init="init()">
        <header class="site-header">
            <div class="wrap">
                <a class="brand" href="#/" @click="closeArticle()">📰 The Starter Times</a>
                <span class="tagline">A Directus + Node starter — generic articles demo</span>
            </div>
        </header>

        <main class="wrap">
            <!-- Loading -->
            <template x-if="loading">
                <p class="state">Loading articles…</p>
            </template>

            <!-- Error / empty -->
            <template x-if="!loading && !current && items.length === 0">
                <div class="state empty">
                    <h2 x-text="error ? 'Could not load articles' : 'No articles yet'"></h2>
                    <p x-show="error" x-text="error"></p>
                    <p x-show="!error">
                        This demo reads <code>/cms/items/Articles</code> from Directus.
                        Seed it with <code>node scripts/seed-directus.mjs</code>, or create an
                        <strong>Articles</strong> collection in the
                        <a :href="adminBase + '/admin'" target="_blank" rel="noopener">CMS admin</a>
                        and grant the Public policy read access.
                    </p>
                </div>
            </template>

            <!-- List view -->
            <template x-if="!loading && !current && items.length > 0">
                <section class="grid">
                    <template x-for="item in items" :key="item.id">
                        <article class="card" @click="openArticle(item)" tabindex="0"
                            @keydown.enter="openArticle(item)">
                            <div class="card-banner" :style="bannerStyle(item.title)">
                                <span x-text="initials(item.title)"></span>
                            </div>
                            <div class="card-body">
                                <h2 class="card-title" x-text="item.title"></h2>
                                <p class="card-meta">
                                    <span x-text="item.author || 'Unknown'"></span>
                                    <span x-show="item.published_date"> · </span>
                                    <span x-text="formatDate(item.published_date)"></span>
                                </p>
                                <p class="card-summary" x-text="item.summary"></p>
                                <span class="read-more">Read →</span>
                            </div>
                        </article>
                    </template>
                </section>
            </template>

            <!-- Reader view -->
            <template x-if="current">
                <article class="reader">
                    <button class="back" @click="closeArticle()">← All articles</button>
                    <div class="reader-banner" :style="bannerStyle(current.title)"></div>
                    <h1 x-text="current.title"></h1>
                    <p class="reader-meta">
                        <span x-text="current.author || 'Unknown'"></span>
                        <span x-show="current.published_date"> · </span>
                        <span x-text="formatDate(current.published_date)"></span>
                        <a class="edit-link" x-show="adminBase" :href="editUrl(current.id)" target="_blank"
                            rel="noopener">Edit in CMS ↗</a>
                    </p>
                    <div class="reader-body" x-html="current.body || '<em>No content.</em>'"></div>
                </article>
            </template>
        </main>

        <footer class="site-footer">
            <div class="wrap">
                <span x-text="'© ' + (new Date().getFullYear()) + ' The Starter Times'"></span>
                <span class="sep">·</span>
                <span>frontend → Node backend → <a :href="adminBase + '/admin'" target="_blank"
                        rel="noopener">Directus</a></span>
            </div>
        </footer>
    </div>

    <script>
        function articlesApp() {
            const cfg = window.APP_CONFIG || {};
            return {
                baseURL: cfg.cmsBase || '/cms',
                adminBase: cfg.cmsAdminUrl || '',
                collection: cfg.cmsCollection || 'Articles',
                items: [],
                current: null,
                loading: true,
                error: '',

                init() {
                    this.loadData().then(() => this.syncFromHash());
                    window.addEventListener('hashchange', () => this.syncFromHash());
                },

                loadData() {
                    // Sort newest first; published filter is enforced server-side by the
                    // Public permission, so we don't need to send it from the browser.
                    const url = this.baseURL + '/items/' + this.collection +
                        '?sort=-published_date&limit=100';
                    return fetch(url)
                        .then(r => r.json())
                        .then(body => {
                            if (body && body.errors) {
                                // Bare Directus (collection/permission missing) -> empty state.
                                this.items = [];
                            } else {
                                this.items = (body && body.data) || [];
                            }
                        })
                        .catch(err => { this.error = String(err); })
                        .finally(() => { this.loading = false; });
                },

                syncFromHash() {
                    const m = location.hash.match(/^#\/a\/(.+)$/);
                    if (m) {
                        const id = decodeURIComponent(m[1]);
                        const found = this.items.find(i => String(i.id) === id);
                        this.current = found || null;
                        window.scrollTo(0, 0);
                    } else {
                        this.current = null;
                    }
                },

                openArticle(item) { location.hash = '#/a/' + encodeURIComponent(item.id); },
                closeArticle() { location.hash = '#/'; },

                editUrl(id) {
                    return (this.adminBase || this.baseURL).replace(/\/$/, '') +
                        '/admin/content/' + this.collection + '/' + id;
                },

                // --- presentation helpers ---
                formatDate(d) {
                    if (!d) return '';
                    const dt = new Date(d);
                    if (isNaN(dt)) return '';
                    return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
                },
                initials(title) {
                    return (title || '?').trim().split(/\s+/).slice(0, 2)
                        .map(w => w[0]).join('').toUpperCase();
                },
                bannerStyle(title) {
                    let h = 0;
                    for (const c of (title || '')) h = (h * 31 + c.charCodeAt(0)) % 360;
                    return `background:linear-gradient(135deg,hsl(${h} 65% 55%),hsl(${(h + 40) % 360} 65% 45%))`;
                },
            };
        }
    </script>
</body>

</html>
